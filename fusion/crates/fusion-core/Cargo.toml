[package]
name = "fusion-core"
description = "Dhava sensor-fusion core: Kalman filtering, gate crossings, airtime detection"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
# `lib` for fusion-worker and tests; `cdylib` for the Android .so and for the
# host dylib that uniffi-bindgen reads to generate Kotlin bindings.
crate-type = ["lib", "cdylib"]

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
uniffi = { workspace = true }
flate2 = { workspace = true }

[dev-dependencies]
