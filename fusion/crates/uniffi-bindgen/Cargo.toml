[package]
name = "uniffi-bindgen"
description = "Binary shim to run uniffi-bindgen against fusion-core (see fusion/scripts/build-android.sh)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "uniffi-bindgen"
path = "src/main.rs"

[dependencies]
uniffi = { workspace = true, features = ["cli"] }
