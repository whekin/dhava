# Nakvali private-alpha stack — deployable on Coolify from the GitHub repository.
# Assign the public domain to `api:8080` in Coolify. No container port is
# published directly on the host; TLS and public routing belong to the proxy.

name: nakvali

services:
  api:
    build:
      # Coolify sets Compose's project directory to the repository root.
      # Keep this path root-relative so local and hosted builds resolve alike.
      context: ./backend
      dockerfile: Dockerfile
    environment:
      PORT: "8080"
      DATABASE_URL: postgres://nakvali:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@db:5432/nakvali?sslmode=disable
      LOG_LEVEL: ${LOG_LEVEL:-info}
      API_ACCESS_KEY: ${API_ACCESS_KEY:?API_ACCESS_KEY is required}
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-}
      RAW_UPLOADS_ENABLED: "false"
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?PUBLIC_BASE_URL is required}
      STRAVA_CLIENT_ID: ${STRAVA_CLIENT_ID:-}
      STRAVA_CLIENT_SECRET: ${STRAVA_CLIENT_SECRET:-}
      STRAVA_APP_REDIRECT_URL: ${STRAVA_APP_REDIRECT_URL:-nakvali://strava/connected}
    expose:
      - "8080"
    secrets:
      - source: firebase_service_account
        target: firebase-service-account.json
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 15s

  db:
    # imresamu/postgis: multi-arch PostGIS build (arm64 + amd64) — the official
    # postgis/postgis image has no arm64 manifest, and both the dev Mac and the
    # Coolify VPS are ARM.
    image: imresamu/postgis:17-3.5
    environment:
      POSTGRES_USER: nakvali
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: nakvali
    volumes:
      - db-data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nakvali -d nakvali"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  db-data:

secrets:
  # Coolify provides compact JSON as a locked literal runtime variable.
  # Native Compose mounts it read-only and does not expose its contents to the API
  # process environment or bake it into the image.
  firebase_service_account:
    environment: FIREBASE_SERVICE_ACCOUNT_JSON
