# Dhava private-alpha stack — deployable on Coolify from the GitHub repository.
# Assign the public domain to `api:8080` in Coolify. No container port is
# published directly on the host; TLS and public routing belong to the proxy.

services:
  api:
    build:
      context: ../backend
      dockerfile: Dockerfile
    environment:
      PORT: "8080"
      DATABASE_URL: postgres://dhava:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@db:5432/dhava?sslmode=disable
      LOG_LEVEL: ${LOG_LEVEL:-info}
      API_ACCESS_KEY: ${API_ACCESS_KEY:?API_ACCESS_KEY is required}
      RAW_UPLOADS_ENABLED: "false"
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?PUBLIC_BASE_URL is required}
      STRAVA_CLIENT_ID: ${STRAVA_CLIENT_ID:-}
      STRAVA_CLIENT_SECRET: ${STRAVA_CLIENT_SECRET:-}
      STRAVA_APP_REDIRECT_URL: ${STRAVA_APP_REDIRECT_URL:-dhava://strava/connected}
    expose:
      - "8080"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 15s

  db:
    # imresamu/postgis: multi-arch PostGIS build (arm64 + amd64) — the official
    # postgis/postgis image has no arm64 manifest, and both the dev Mac and the
    # Coolify VPS are ARM.
    image: imresamu/postgis:17-3.5
    environment:
      POSTGRES_USER: dhava
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: dhava
    volumes:
      - db-data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dhava -d dhava"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  db-data:
