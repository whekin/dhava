[versions]
# Build tooling — baseline combo taken from a known-good project on this machine.
agp = "9.3.1"
kotlin = "2.4.10"

# Android SDK levels
# Compile-time only: new AndroidX (core 1.19, lifecycle 2.11) refuses to be
# consumed by anything compiling against less. Does not affect what the app
# does on a device.
compileSdk = "37"
# Stays at the OS actually tested against (Android 16 = API 36). Raising this
# opts into runtime behaviour changes of an OS release, which is a deliberate,
# testable decision and not a side effect of a dependency bump.
targetSdk = "36"
minSdk = "26"

# AndroidX
androidxAnnotation = "1.10.0"
coreKtx = "1.19.0"
lifecycleRuntimeKtx = "2.11.0"
activityCompose = "1.13.0"
composeBom = "2026.06.01"
# 1.4.0 stable made MaterialExpressiveTheme internal; the 1.5 alphas expose it
# again behind @ExperimentalMaterial3ExpressiveApi.
# Carries the BottomSheet motion fix (b/452071842), which landed in alpha16: sheets now
# respect MaterialTheme.motionScheme during nested scroll and drag instead of a hardcoded
# settle, which is what could hold a child scroll gesture while the sheet was moving.
# Pinned at alpha18 rather than newer: alpha21 deprecates the sheet state APIs this app
# uses in favour of a unified rememberBottomSheetState, which is its own migration.
material3 = "1.5.0-alpha18"
navigationCompose = "2.9.8"

# Recording stack
kotlinxSerialization = "1.11.0"
kotlinxCoroutines = "1.11.0"
playServicesLocation = "21.4.0"
okhttp = "5.4.0"
workManager = "2.11.2"

# Identity
googleServices = "4.5.0"
firebaseBom = "34.17.0"
credentials = "1.6.0"
googleId = "1.2.0"

# Fusion core FFI (UniFFI-generated bindings load libfusion_core.so via JNA)
jna = "5.19.1"
junit = "4.13.2"

# Map rendering (activity detail)
maplibre = "11.11.0"

[libraries]
androidx-annotation = { group = "androidx.annotation", name = "annotation", version.ref = "androidxAnnotation" }
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycleRuntimeKtx" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
# material3 is pinned explicitly (not BOM-managed) to guarantee the Expressive APIs.
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3", version.ref = "material3" }
androidx-compose-material-icons-core = { group = "androidx.compose.material", name = "material-icons-core" }
androidx-compose-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigationCompose" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycleRuntimeKtx" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinxSerialization" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "kotlinxCoroutines" }
kotlinx-coroutines-play-services = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-play-services", version.ref = "kotlinxCoroutines" }
play-services-location = { group = "com.google.android.gms", name = "play-services-location", version.ref = "playServicesLocation" }
okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
androidx-work-runtime-ktx = { group = "androidx.work", name = "work-runtime-ktx", version.ref = "workManager" }
firebase-bom = { group = "com.google.firebase", name = "firebase-bom", version.ref = "firebaseBom" }
firebase-auth = { group = "com.google.firebase", name = "firebase-auth" }
androidx-credentials = { group = "androidx.credentials", name = "credentials", version.ref = "credentials" }
androidx-credentials-play-services-auth = { group = "androidx.credentials", name = "credentials-play-services-auth", version.ref = "credentials" }
googleid = { group = "com.google.android.libraries.identity.googleid", name = "googleid", version.ref = "googleId" }
# Consumed as @aar in :core:fusion — the plain jar lacks the Android native JNA dispatch library.
jna = { group = "net.java.dev.jna", name = "jna", version.ref = "jna" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
maplibre-android = { group = "org.maplibre.gl", name = "android-sdk", version.ref = "maplibre" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
google-services = { id = "com.google.gms.google-services", version.ref = "googleServices" }
