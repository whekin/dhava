# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# AndroidX
android.useAndroidX=true
# Only keep each module's own resources in its R class.
android.nonTransitiveRClass=true

# AGP 9 turned the rewritten DSL on by default. Kept off for now so the module
# build files stay as they are: the AGP 9 upgrade already changes the toolchain,
# and the DSL rewrite is a separate mechanical pass worth doing on its own.
android.newDsl=false
