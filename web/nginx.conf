server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    # No request logs: OAuth query strings must never be stored here.
    access_log off;
    error_log /dev/stderr warn;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;

    location = /healthz { return 200 'ok\n'; add_header Content-Type text/plain; }
    location = /.well-known/assetlinks.json {
        default_type application/json;
        add_header Cache-Control 'public, max-age=300';
        try_files $uri =404;
    }
    location = /oauth/bikeyard/callback {
        # No redirects or fallback to the homepage for authorization responses.
        add_header Cache-Control 'no-store';
        add_header Referrer-Policy no-referrer always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Robots-Tag 'noindex, nofollow' always;
        try_files /oauth/bikeyard/callback.html =404;
    }
    # The site's root route must not turn a missing API route into HTML.
    location = /api { return 404; }
    location ^~ /api/ { return 404; }
    location /_astro/ {
        add_header Cache-Control 'public, max-age=31536000, immutable';
        try_files $uri =404;
    }
    location / { try_files $uri $uri.html $uri/ =404; }
    error_page 404 /404.html;
    location = /404.html { internal; }
}
